<text x="53.98" y="45.00" font-family="Inter" font-size="4.20" font-weight="300" fill="#1d1d1f" text-anchor="middle">The free system that runs the world.</text>
<line x1="9.00" y1="52.00" x2="98.95" y2="52.00" stroke="#d2d2d7" stroke-width="0.25"/>
<text x="9.00" y="61.00" font-family="Inter" font-size="4.40" font-weight="600" fill="#1d1d1f" text-anchor="start">What is it?</text>
<text x="9.00" y="66.06" font-family="Inter" font-size="3.20" font-weight="400" fill="#333333" text-anchor="start">An operating system, like Windows or macOS. Its heart</text>
<text x="9.00" y="70.38" font-family="Inter" font-size="3.20" font-weight="400" fill="#333333" text-anchor="start">is the kernel: the part that talks to the hardware.</text>
<line x1="9.00" y1="75.14" x2="98.95" y2="75.14" stroke="#d2d2d7" stroke-width="0.25"/>
<text x="23.99" y="87.14" font-family="Inter" font-size="6.20" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.1">1991</text>
<text x="23.99" y="93.14" font-family="Inter" font-size="2.50" font-weight="600" fill="#333333" text-anchor="middle">Linus Torvalds</text>
<text x="23.99" y="96.64" font-family="Inter" font-size="2.50" font-weight="300" fill="#333333" text-anchor="middle">starts it as a hobby</text>
<text x="53.98" y="87.14" font-family="Inter" font-size="6.20" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.1">Free</text>
