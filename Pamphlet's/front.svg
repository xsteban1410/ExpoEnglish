<text x="53.98" y="96.64" font-family="Inter" font-size="2.50" font-weight="300" fill="#333333" text-anchor="middle">the code is public</text>
<text x="83.96" y="87.14" font-family="Inter" font-size="5.20" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.1">500/500</text>
<text x="83.96" y="93.14" font-family="Inter" font-size="2.50" font-weight="600" fill="#333333" text-anchor="middle">Top supercomputers</text>
<text x="83.96" y="96.64" font-family="Inter" font-size="2.50" font-weight="300" fill="#333333" text-anchor="middle">run Linux</text>
<line x1="9.00" y1="103.14" x2="98.95" y2="103.14" stroke="#d2d2d7" stroke-width="0.25"/>
<text x="9.00" y="112.14" font-family="Inter" font-size="4.40" font-weight="600" fill="#1d1d1f" text-anchor="start">It's everywhere</text>
