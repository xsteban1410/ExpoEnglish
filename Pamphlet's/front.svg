<g transform="translate(6.00,6.00)"><rect x="0.00" y="0.00" width="101.95" height="133.70" rx="0" fill="#f2f0eb" stroke="none" stroke-width="0"/>
<text x="9.00" y="13.00" font-family="Inter" font-size="2.60" font-weight="600" fill="#666666" text-anchor="start">English presentation</text>
<text x="8.40" y="30.00" font-family="Inter" font-size="17.00" font-weight="500" fill="#292827" text-anchor="start" letter-spacing="-0.45">Linux</text>
<text x="9.00" y="38.00" font-family="Inter" font-size="4.00" font-weight="400" fill="#292827" text-anchor="start" letter-spacing="-0.05">The free system that runs the world.</text>
<rect x="9.00" y="44.00" width="83.95" height="26.00" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="13.00" y="51.00" font-family="Inter" font-size="3.20" font-weight="600" fill="#292827" text-anchor="start">What is it?</text>
<text x="13.00" y="55.82" font-family="Inter" font-size="2.90" font-weight="400" fill="#292827" text-anchor="start">An operating system, like Windows or macOS. Its</text>
<text x="13.00" y="59.73" font-family="Inter" font-size="2.90" font-weight="400" fill="#292827" text-anchor="start">heart is the kernel: the part that talks to the</text>
<text x="13.00" y="63.65" font-family="Inter" font-size="2.90" font-weight="400" fill="#292827" text-anchor="start">hardware.</text>
<rect x="9.00" y="74.00" width="25.98" height="24.00" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="12.00" y="83.00" font-family="Inter" font-size="5.60" font-weight="500" fill="#421d24" text-anchor="start" letter-spacing="-0.15">1991</text>
<text x="12.00" y="89.50" font-family="Inter" font-size="2.30" font-weight="600" fill="#292827" text-anchor="start">Linus Torvalds</text>
<text x="12.00" y="93.30" font-family="Inter" font-size="2.30" font-weight="400" fill="#666666" text-anchor="start">starts it as a hobby</text>
<rect x="37.98" y="74.00" width="25.98" height="24.00" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="40.98" y="83.00" font-family="Inter" font-size="5.60" font-weight="500" fill="#421d24" text-anchor="start" letter-spacing="-0.15">Free</text>
<text x="40.98" y="89.50" font-family="Inter" font-size="2.30" font-weight="600" fill="#292827" text-anchor="start">Open source</text>
<text x="40.98" y="93.30" font-family="Inter" font-size="2.30" font-weight="400" fill="#666666" text-anchor="start">the code is public</text>
<rect x="66.97" y="74.00" width="25.98" height="24.00" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="69.97" y="83.00" font-family="Inter" font-size="4.60" font-weight="500" fill="#421d24" text-anchor="start" letter-spacing="-0.15">500/500</text>
<text x="69.97" y="89.50" font-family="Inter" font-size="2.30" font-weight="600" fill="#292827" text-anchor="start">Supercomputers</text>
<text x="69.97" y="93.30" font-family="Inter" font-size="2.30" font-weight="400" fill="#666666" text-anchor="start">all run Linux</text>
<rect x="0.00" y="104.00" width="101.95" height="29.70" rx="0" fill="#421d24" stroke="none" stroke-width="0"/>
<text x="9.00" y="112.00" font-family="Inter" font-size="3.80" font-weight="500" fill="#ffffff" text-anchor="start">It's everywhere</text>
<text x="9.00" y="116.66" font-family="Inter" font-size="2.70" font-weight="400" fill="#c6bbbd" text-anchor="start">Internet servers, Android phones, smart TVs, cars,</text>
<text x="9.00" y="120.30" font-family="Inter" font-size="2.70" font-weight="400" fill="#c6bbbd" text-anchor="start">routers, the Steam Deck and even a NASA helicopter on</text>
<text x="9.00" y="123.95" font-family="Inter" font-size="2.70" font-weight="400" fill="#c6bbbd" text-anchor="start">Mars.</text>
<text x="9.00" y="128.70" font-family="Inter" font-size="2.30" font-weight="600" fill="#ffffff" text-anchor="start">Free · Secure · Customizable · Big community</text></g>
