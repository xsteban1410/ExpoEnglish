# Publica la encuesta en https://xsteban1410.github.io/ExpoEnglish/ (Settings → Pages → Source: GitHub Actions).
name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["Web Questions (What's Linux you're?)/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test quiz
        run: node --test "Web Questions (What's Linux you're?)/quiz.test.js"
      - name: Prepare site
        run: |
          mkdir _site
          cp "Web Questions (What's Linux you're?)"/{index.html,style.css,quiz.js} _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
